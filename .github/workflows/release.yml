name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download iperf3 (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $api = "https://api.github.com/repos/ar51an/iperf3-win-builds/releases/latest"
          $rel = Invoke-RestMethod -Uri $api -Headers @{ "User-Agent" = "GitHubActions" }
          $asset = $rel.assets | Where-Object { $_.name -match "win64.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "未找到 iperf3 Windows x64 压缩包" }
          Write-Host "下载 $($asset.name) ..."
          $zip = Join-Path $env:RUNNER_TEMP "iperf3.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -UseBasicParsing
          $dest = Join-Path $env:RUNNER_TEMP "iperf3"
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Recurse -Filter iperf3.exe | Select-Object -First 1
          if (-not $exe) { throw "压缩包内没有 iperf3.exe" }
          Copy-Item $exe.FullName "bin\iperf3.exe"
          Get-ChildItem $exe.Directory -Filter *.dll | ForEach-Object { Copy-Item $_.FullName (Join-Path "bin" $_.Name) -Force }
          Get-ChildItem bin | Format-Table Name, Length

      - name: Build exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Prepare ASCII-named exe
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if (-not $ver) { $ver = "dev" }
          $src = Join-Path "dist" "网络工具.exe"
          if (-not (Test-Path $src)) { throw "未找到 dist\网络工具.exe" }
          Copy-Item $src (Join-Path "dist" "WangLuoGongJu-$ver.exe") -Force
          Get-Item $src, (Join-Path "dist" "WangLuoGongJu-$ver.exe") | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WangLuoGongJu-*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build macOS arm64 zip
        run: bash build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/WangLuoGongJu-*-macOS-arm64.zip
          if-no-files-found: error

  build-macos-intel:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build macOS x64 zip
        run: bash build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/WangLuoGongJu-*-macOS-x64.zip
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lah artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 网络工具 ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            artifacts/WangLuoGongJu-${{ github.ref_name }}.exe
            artifacts/WangLuoGongJu-${{ github.ref_name }}-macOS-arm64.zip
            artifacts/WangLuoGongJu-${{ github.ref_name }}-macOS-x64.zip
          generate_release_notes: false
          body: |
            「网络工具」**${{ github.ref_name }}**，提供 Windows 与 macOS 桌面版。

            ## 下载

            - **Windows 10/11**：[`WangLuoGongJu-${{ github.ref_name }}.exe`](https://github.com/cnsunsz/wangluo-gongju/releases/download/${{ github.ref_name }}/WangLuoGongJu-${{ github.ref_name }}.exe)（可改名为「网络工具.exe」后双击使用）。需要 WebView2（Windows 11 通常已自带）。
            - **macOS Apple Silicon（arm64）**：[`WangLuoGongJu-${{ github.ref_name }}-macOS-arm64.zip`](https://github.com/cnsunsz/wangluo-gongju/releases/download/${{ github.ref_name }}/WangLuoGongJu-${{ github.ref_name }}-macOS-arm64.zip)。解压得到「网络工具.app」。
            - **macOS Intel（x64）**：若本次构建成功，同目录还有 `WangLuoGongJu-${{ github.ref_name }}-macOS-x64.zip`。

            macOS 包未经 Apple 公证。第一次打开请按住 Control 点击「网络工具.app」选择「打开」，或在「系统设置 → 隐私与安全性」中允许。也可在终端执行 `xattr -dr com.apple.quarantine 网络工具.app` 后再打开。

            无需安装，不会在程序旁边创建 data 文件夹。

            配置与日志：
            - Windows：`%LOCALAPPDATA%\网络工具\`
            - macOS：`~/Library/Application Support/网络工具/`

            ## 1.2.2 更新

            - **修复 Windows 无法启动**：v1.2.1 把 PNG 当成窗口/托盘图标交给系统，进程会在启动时静默退出。本版在 Windows 上只向窗口传入 `.ico`；托盘用 Pillow 转为位图。图标失败会降级为无图标继续打开，异常写入 `%LOCALAPPDATA%\网络工具\logs\app.log`。
            - **崩溃后可再次打开**：上次异常退出留下的单实例锁，若进程已死或服务无响应，会自动接管。
            - **macOS 启动防护**：打包并优先使用 `app.icns`，不把 Windows `.ico` 直接交给 Cocoa。菜单栏托盘在主窗口就绪后再创建，失败不影响 Dock 与主界面。

            ## 1.2.1 已有能力

            - 减号 / 黄灯最小化到任务栏或 Dock；点关闭才进托盘或后台。标题栏可搜索工具。
            - 提供 macOS Apple Silicon 版（另尝试 Intel 包）。SSH、服务器信息提取等通用能力可用；Windows 诊断与 WLAN 仅 Windows 显示。网卡叠加在 Mac 上不接管系统代理。

            ## 1.2.0 已有能力

            - 网页在软件内打开（例如三网拨测），不跳系统浏览器。
            - 已删除「分享软件」。
            - 网卡叠加、服务器信息提取、SSH（可保存主机）、路由表、ARP 表、网卡实时流量、NAT 类型检测。

  publish-macos-intel:
    needs: [build-macos-intel, release]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-macos-intel.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: artifacts

      - name: Attach Intel zip to existing Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: artifacts/WangLuoGongJu-${{ github.ref_name }}-macOS-x64.zip
